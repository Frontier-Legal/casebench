name: A new jurisdiction
description: Propose an adapter for a country's court decisions and citation formats.
labels: [adapter]
body:
  - type: input
    id: country
    attributes:
      label: Country or jurisdiction
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Where decisions come from
      description: The public or licensed sources, their access terms, and whether statute versions by date are available.
    validations:
      required: true
  - type: textarea
    id: citations
    attributes:
      label: Citation formats
      description: Two or three real examples of how courts cite decisions and statutes.
  - type: textarea
    id: maintainers
    attributes:
      label: Who would maintain it
