name: Something you need
description: A task, a metric, a target type or a workflow Casebench does not support yet.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: Describe the job, not the solution. Who runs it, on what data, and what they need to see.
    validations:
      required: true
  - type: input
    id: context
    attributes:
      label: Jurisdiction and task
  - type: textarea
    id: today
    attributes:
      label: How you do it today
