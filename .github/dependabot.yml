version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # A release must be a week old before it is proposed, zizmor's dependabot-cooldown default.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tools:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release must be a week old before it is proposed, zizmor's dependabot-cooldown default.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
