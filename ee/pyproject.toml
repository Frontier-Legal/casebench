# SPDX-License-Identifier: Elastic-2.0
[project]
name = "casebench-ee"
version = "0.6.0"  # x-release-please-version
description = "Casebench's team server: logins, roles, an audit log and admin pages on the workbench"
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # Released together, at the same version.
    "casebench==0.6.0",  # x-release-please-version
    "psycopg[binary]>=3.3.6",
    "pyjwt[crypto]>=2.15.1",
]

[project.urls]
Repository = "https://github.com/Frontier-Legal/casebench"
Issues = "https://github.com/Frontier-Legal/casebench/issues"
Changelog = "https://github.com/Frontier-Legal/casebench/blob/main/CHANGELOG.md"

[project.scripts]
casebench-team = "casebench_ee.cli:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
casebench = { workspace = true }
