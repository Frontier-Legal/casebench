[project]
name = "casebench"
version = "0.0.0"
description = "Measure the legal accuracy of an AI system against court decisions and lawyer-written references."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Casebench maintainers" }]
keywords = ["legal", "evaluation", "llm", "benchmark", "citations"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.5.0",
    "pydantic>=2.14.0",
]

[project.urls]
Repository = "https://github.com/Frontier-Legal/casebench"
Issues = "https://github.com/Frontier-Legal/casebench/issues"
Changelog = "https://github.com/Frontier-Legal/casebench/blob/main/CHANGELOG.md"

[project.scripts]
casebench = "casebench.cli:main"

[project.entry-points."casebench.corpus"]
folder = "casebench.corpus.connectors.folder:Connector"

[build-system]
requires = ["uv_build>=0.9.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Turkish dotless and dotted i are letters in court names and fixtures, not look-alikes.
allowed-confusables = ["ı", "İ"]

[tool.pyright]
include = ["casebench", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.commitizen]
name = "cz_conventional_commits"

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]
