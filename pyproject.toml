[project]
name = "casebench"
version = "0.1.1"
description = "Measure the legal accuracy of an AI system against court decisions and lawyer-written references."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Casebench maintainers" }]
keywords = ["legal", "evaluation", "llm", "benchmark", "citations"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "alembic>=1.16.0",
    "click>=8.5.0",
    "fastapi>=0.120.0",
    "httpx2>=2.13.1",
    "jsonpath-ng>=1.10.0",
    "mcp>=2.3.0",
    "openpyxl>=3.1.5",
    "opentelemetry-proto>=1.45.1",
    "packaging>=26.3",
    "pydantic>=2.14.0",
    "pyyaml>=6.0.3",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sqlalchemy>=2.0.40",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/Frontier-Legal/casebench"
Issues = "https://github.com/Frontier-Legal/casebench/issues"
Changelog = "https://github.com/Frontier-Legal/casebench/blob/main/CHANGELOG.md"

[project.scripts]
casebench = "casebench.cli:main"

[project.entry-points."casebench.capture"]
anthropic = "casebench.capture.parsers.anthropic:Parser"
gemini = "casebench.capture.parsers.gemini:Parser"
openai = "casebench.capture.parsers.openai:Parser"

[project.entry-points."casebench.corpus"]
folder = "casebench.corpus.connectors.folder:Connector"
http = "casebench.corpus.connectors.http:Connector"
mcp = "casebench.corpus.connectors.mcp:Connector"

[project.entry-points."casebench.metrics"]
authority_ndcg = "casebench.metrics.builtin.authority_ndcg:Metric"
authority_recall = "casebench.metrics.builtin.authority_recall:Metric"
citation_integrity = "casebench.metrics.builtin.citation_integrity:CitationIntegrity"
criteria = "casebench.metrics.builtin.criteria:Metric"
edit_preservation = "casebench.metrics.builtin.edit_preservation:Metric"
fields = "casebench.metrics.builtin.fields:Metric"
issues_found = "casebench.metrics.builtin.issues_found:Metric"
outcome = "casebench.metrics.builtin.outcome:Metric"
precedent = "casebench.metrics.builtin.precedent:Metric"
statute = "casebench.metrics.builtin.statute:Metric"

[project.entry-points."casebench.providers"]
anthropic = "casebench.providers.builtin.anthropic:Provider"
azure = "casebench.providers.builtin.azure:Provider"
bedrock = "casebench.providers.builtin.bedrock:Provider"
google = "casebench.providers.builtin.google:Provider"
openai = "casebench.providers.builtin.openai:Provider"

[project.entry-points.pytest11]
casebench = "casebench.pytest_plugin"

[project.entry-points."casebench.tasks"]
drafting = "casebench.tasks.builtin.drafting:Task"
editing = "casebench.tasks.builtin.editing:Task"
extraction = "casebench.tasks.builtin.extraction:Task"
outcome = "casebench.tasks.builtin.outcome:Task"
qa = "casebench.tasks.builtin.qa:Task"
research = "casebench.tasks.builtin.research:Task"

[project.entry-points."casebench.targets"]
command = "casebench.targets.builtin.command:Target"
http = "casebench.targets.builtin.http:Target"
python = "casebench.targets.builtin.python:Target"

[build-system]
requires = ["uv_build>=0.9.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Turkish dotless and dotted i are letters in court names and fixtures, not look-alikes.
allowed-confusables = ["ı", "İ"]

[tool.pyright]
include = ["casebench", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.commitizen]
name = "cz_conventional_commits"

[dependency-groups]
dev = [
    "anthropic>=1.13.0",
    "commitizen>=4.19.2",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "openai>=3.29.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pre-commit>=4.6.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]
